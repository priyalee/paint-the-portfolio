# Builds the site and deploys it to Cloudflare Pages on every push to main
# (the live site, ink-pigment.pages.dev).
#
# Other branches are not deployed: preview deployments would share the live
# database, which would let people write to the real walls through a preview
# address. Run the workflow by hand (Actions -> Deploy -> Run workflow) to
# redeploy main.
#
# Needs one repository secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit" and "D1: Edit"
# The account id below is not private: it only says which account to use.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a2c269f6fb129d2be0ec1db8133babb6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the server code
        run: npm run check:server

      - name: Build the site
        run: npm run build

      - name: Stop unless this is main
        if: github.ref_name != 'main'
        run: |
          echo "Only main is deployed (previews would share the live database)."
          exit 1

      - name: Update the database tables
        run: npx wrangler d1 migrations apply ink-pigment --remote

      - name: Deploy to Cloudflare Pages
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: npx wrangler pages deploy --branch="$BRANCH" --commit-hash="$COMMIT" --commit-message="$(git log -1 --pretty=%s)"
