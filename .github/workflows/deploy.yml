# Builds the site and deploys it to Cloudflare Pages on every push.
#   main         -> the live site (ink-pigment.pages.dev)
#   other branch -> a preview link (<branch>.ink-pigment.pages.dev)
#
# Needs one repository secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit" and "D1: Edit"
# The account id below is not private: it only says which account to use.
name: Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a2c269f6fb129d2be0ec1db8133babb6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the server code
        run: npm run check:server

      - name: Build the site
        run: npm run build

      - name: Update the database tables
        if: github.ref_name == 'main'
        run: npx wrangler d1 migrations apply ink-pigment --remote

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --branch="${{ github.ref_name }}" --commit-hash="${{ github.sha }}" --commit-message="$(git log -1 --pretty=%s)"
