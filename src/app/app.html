<!-- Shared SVG filters used by paint effects across the site -->
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- Wobbly edge for the flood blob: looks like ink bleeding into paper -->
    <filter id="ink-bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" />
      <feDisplacementMap in="SourceGraphic" scale="22" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <!-- Dry-brush edge for the timeline stroke -->
    <filter id="brush-edge" x="-50%" y="-5%" width="200%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="8" />
      <feDisplacementMap in="SourceGraphic" scale="4" />
    </filter>
  </defs>
</svg>
